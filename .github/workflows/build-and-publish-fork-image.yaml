name: Build and publish fork Docker image

# Fork-only workflow. Upstream publishes ghcr.io/mbinorg/mbin from action.yaml,
# which this fork cannot push to. This builds the same docker/Dockerfile and
# publishes it under the fork's own namespace instead.
#
# Branch pushes build the image. Release tags do not rebuild: they retag the
# digest the branch push already produced, so the release tag and :latest are
# provably the same bits.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*+paisans'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta data
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  retag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker tags cannot contain '+', so the SemVer build metadata separator
      # becomes '-': v1.11.0+paisans is published as 1.11.0-paisans.
      - name: Retag the image the branch build already produced
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version//+/-}"
          source="${IMAGE}:sha-${GITHUB_SHA::7}"

          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::No image found at ${source}. Push the branch and let its"
            echo "::error::build finish before pushing the release tag."
            exit 1
          fi

          docker buildx imagetools create -t "${IMAGE}:${version}" "$source"
          docker buildx imagetools inspect "${IMAGE}:${version}"
